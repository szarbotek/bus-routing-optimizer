<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="440" fill="#0f172a" rx="12"/>
  
  <!-- Title -->
  <text x="460" y="34" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">Bus Routing Optimization (4 Layers, 8 Inputs)</text>

  <!-- ==================== LEFT PANEL: WORST CASE ==================== -->
  <rect x="24" y="54" width="420" height="362" fill="#1e293b" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="234" y="82" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">Least Optimal Case (6 Crossings)</text>
  <text x="234" y="102" fill="#94a3b8" font-size="12" text-anchor="middle">lvl = [1, 2, 3, 4] | field = [4, 3, 2, 1, 4, 3, 2, 1]</text>

  <!-- Layers Left -->
  <text x="44" y="138" fill="#ef4444" font-size="12" font-weight="bold">L1</text>
  <line x1="72" y1="134" x2="416" y2="134" stroke="#ef4444" stroke-width="2.5"/>
  
  <text x="44" y="178" fill="#f59e0b" font-size="12" font-weight="bold">L2</text>
  <line x1="72" y1="174" x2="416" y2="174" stroke="#f59e0b" stroke-width="2.5"/>

  <text x="44" y="218" fill="#10b981" font-size="12" font-weight="bold">L3</text>
  <line x1="72" y1="214" x2="416" y2="214" stroke="#10b981" stroke-width="2.5"/>

  <text x="44" y="258" fill="#3b82f6" font-size="12" font-weight="bold">L4</text>
  <line x1="72" y1="254" x2="416" y2="254" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Gate Terminals Left -->
  <!-- 1: L4 -->
  <line x1="90" y1="254" x2="90" y2="335" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="90" cy="254" r="4" fill="#3b82f6"/>

  <!-- 2: L3 -> crosses L4 (cut 1) -->
  <line x1="134" y1="214" x2="134" y2="335" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="134" cy="214" r="4" fill="#10b981"/>
  <circle cx="134" cy="254" r="6" fill="none" stroke="#f87171" stroke-width="2"/>

  <!-- 3: L2 -> crosses L3, L4 (cuts 2, 3) -->
  <line x1="178" y1="174" x2="178" y2="335" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="178" cy="174" r="4" fill="#f59e0b"/>
  <circle cx="178" cy="214" r="6" fill="none" stroke="#f87171" stroke-width="2"/>
  <circle cx="178" cy="254" r="6" fill="none" stroke="#f87171" stroke-width="2"/>

  <!-- 4: L1 -> crosses L2, L3, L4 (cuts 4, 5, 6) -->
  <line x1="222" y1="134" x2="222" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="222" cy="134" r="4" fill="#ef4444"/>
  <circle cx="222" cy="174" r="6" fill="none" stroke="#f87171" stroke-width="2"/>
  <circle cx="222" cy="214" r="6" fill="none" stroke="#f87171" stroke-width="2"/>
  <circle cx="222" cy="254" r="6" fill="none" stroke="#f87171" stroke-width="2"/>

  <!-- 5: L4 -->
  <line x1="266" y1="254" x2="266" y2="335" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="266" cy="254" r="4" fill="#3b82f6"/>

  <!-- 6: L3 -->
  <line x1="310" y1="214" x2="310" y2="335" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="310" cy="214" r="4" fill="#10b981"/>

  <!-- 7: L2 -->
  <line x1="354" y1="174" x2="354" y2="335" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="354" cy="174" r="4" fill="#f59e0b"/>

  <!-- 8: L1 -->
  <line x1="398" y1="134" x2="398" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="398" cy="134" r="4" fill="#ef4444"/>

  <!-- Gate Boxes Left -->
  <rect x="74" y="335" width="164" height="32" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="156" y="355" fill="#f8fafc" font-size="12" text-anchor="middle">Gate A [4, 3, 2, 1]</text>

  <rect x="250" y="335" width="164" height="32" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="332" y="355" fill="#f8fafc" font-size="12" text-anchor="middle">Gate B [4, 3, 2, 1]</text>

  <text x="234" y="396" fill="#fca5a5" font-size="12" text-anchor="middle">Red circles = 6 active wire crossings</text>


  <!-- ==================== RIGHT PANEL: BEST CASE ==================== -->
  <rect x="476" y="54" width="420" height="362" fill="#1e293b" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="686" y="82" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">Most Optimal Case (0 Crossings)</text>
  <text x="686" y="102" fill="#94a3b8" font-size="12" text-anchor="middle">lvl = [4, 3, 2, 1] | field = [4, 4, 3, 3, 2, 2, 1, 1]</text>

  <!-- Layers Right -->
  <text x="496" y="138" fill="#3b82f6" font-size="12" font-weight="bold">L4</text>
  <line x1="524" y1="134" x2="868" y2="134" stroke="#3b82f6" stroke-width="2.5"/>
  
  <text x="496" y="178" fill="#10b981" font-size="12" font-weight="bold">L3</text>
  <line x1="524" y1="174" x2="868" y2="174" stroke="#10b981" stroke-width="2.5"/>

  <text x="496" y="218" fill="#f59e0b" font-size="12" font-weight="bold">L2</text>
  <line x1="524" y1="214" x2="868" y2="214" stroke="#f59e0b" stroke-width="2.5"/>

  <text x="496" y="258" fill="#ef4444" font-size="12" font-weight="bold">L1</text>
  <line x1="524" y1="254" x2="868" y2="254" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Gate Terminals Right -->
  <line x1="542" y1="134" x2="542" y2="335" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="542" cy="134" r="4" fill="#3b82f6"/>

  <line x1="586" y1="134" x2="586" y2="335" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="586" cy="134" r="4" fill="#3b82f6"/>

  <line x1="630" y1="174" x2="630" y2="335" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="630" cy="174" r="4" fill="#10b981"/>

  <line x1="674" y1="174" x2="674" y2="335" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="674" cy="174" r="4" fill="#10b981"/>

  <line x1="718" y1="214" x2="718" y2="335" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="718" cy="214" r="4" fill="#f59e0b"/>

  <line x1="762" y1="214" x2="762" y2="335" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="762" cy="214" r="4" fill="#f59e0b"/>

  <line x1="806" y1="254" x2="806" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="806" cy="254" r="4" fill="#ef4444"/>

  <line x1="850" y1="254" x2="850" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="850" cy="254" r="4" fill="#ef4444"/>

  <!-- Gate Boxes Right -->
  <rect x="526" y="335" width="164" height="32" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="608" y="355" fill="#f8fafc" font-size="12" text-anchor="middle">Gate B' [4, 4, 3, 3]</text>

  <rect x="702" y="335" width="164" height="32" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="784" y="355" fill="#f8fafc" font-size="12" text-anchor="middle">Gate A' [2, 2, 1, 1]</text>

  <text x="686" y="396" fill="#86efac" font-size="12" text-anchor="middle">Zero crossings — each layer ends before lower drops</text>
</svg>
